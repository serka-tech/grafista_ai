# Grafista AI Studio — Staging Deploy Workflow TEMPLATE (Production Step 12, updated for Render + Cloudflare R2 in Production Step 13)
#
# ═══════════════════════════════════════════════════════════════════════
# THIS IS A PASSIVE TEMPLATE, NOT AN ACTIVE WORKFLOW.
# ═══════════════════════════════════════════════════════════════════════
#
# It lives in docs/, not .github/workflows/, on purpose — GitHub Actions
# only ever discovers workflow files under .github/workflows/, so this
# file is inert by location alone, the same reasoning
# docs/ci-stable-profile.md's "Production Step 7" used for stable-ci.yml
# before a remote existed (see that doc's "Why no GitHub Actions file
# yet" section, superseded there but the reasoning about inertness still
# applies here). Production Step 13 narrowed the "provider not yet
# selected" gap this file originally had — Render + Cloudflare R2 ARE now
# selected (docs/managed-infrastructure-plan.md §9) — but NO account/
# service/secret exists yet (docs/render-staging-blueprint.template.yaml
# is equally passive, for the same reason). Copying this into
# .github/workflows/ before real Render services + R2 bucket + secrets
# exist would fail on every run (the deploy-hook secrets referenced below
# do not exist anywhere yet).
#
# Every ${{ secrets.* }} reference below matches a REAL variable name
# from docs/deployment-runbook.md §18c's staging env/secrets matrix — but
# this file contains ZERO secret values, and this workflow does not
# create, request, or imply any real Render/Cloudflare account or
# credential.
#
# Mirrors docs/deployment-runbook.md §18d's 6-step staging deploy flow
# (build → deploy → migrate → health check → smoke → restore drill), now
# split into two jobs: a CI gate job (must pass before deploy is even
# attempted) and the deploy job itself. Deploy (step 2) now uses Render's
# real Deploy Hook mechanism (confirmed against
# https://render.com/docs/deploy-hooks during this step: "send a basic
# GET or POST request to your service's deploy hook URL — no special
# headers required", one secret URL per service, available from that
# service's Settings tab). Restore drill (step 6) is still a manual-gate
# reminder, not an automated step — see the comment on that step for why.

name: "TEMPLATE — Staging Deploy, Render + R2 (inactive, not in .github/workflows/)"

# workflow_dispatch only, deliberately — this template does not assume a
# push-triggers-deploy model. Render's own GitHub integration can ALSO
# auto-deploy on push independently of this workflow (see
# docs/render-staging-blueprint.template.yaml's autoDeployTrigger, set to
# "off" there as a safe starting default) — if that is enabled instead,
# most of this workflow becomes redundant except migrate/health/smoke,
# which would then run as a separate, deploy-hook-triggered flow. Which
# of these two patterns to use is a decision for actual provisioning
# time, not decided here.
on:
  workflow_dispatch: {}

jobs:
  # ── CI gate ──────────────────────────────────────────────────────────
  # Mirrors .github/workflows/stable-ci.yml's own "stable" job — this is
  # NOT a replacement for that real, active workflow; it exists here so
  # this template is self-contained and doesn't silently assume the
  # reader already knows ci:stable must pass first. A real activation of
  # this file could instead use `needs:` against the real stable-ci.yml
  # job if both live in the same workflow run, or simply rely on branch
  # protection requiring stable-ci.yml to pass before merge — either is a
  # decision for provisioning time.
  ci-gate:
    name: CI gate (typecheck/lint/build/test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:stable

  staging-deploy:
    name: Deploy, migrate, verify (staging)
    runs-on: ubuntu-latest
    needs: ci-gate
    # No `environment:` block yet — GitHub Environments (with their own
    # secret scoping / required reviewers) are a reasonable pairing once
    # real Render/R2 secrets exist; not configured here.
    steps:
      # ── Step 2: Deploy (Render Deploy Hooks) ──────────────────────────
      # Render Deploy Hooks are per-service secret URLs (Settings tab of
      # each service) — POSTing (or GETing) to one triggers that
      # service's own build+deploy on Render's infrastructure. This
      # workflow does NOT run `docker build`/`next build` itself for
      # deploy — Render does, using whichever path
      # docs/render-staging-blueprint.template.yaml's service definition
      # specifies (Docker or native Node — see that file's HIGH-RISK note
      # on the Docker path's unverified host-build-first requirement).
      - name: "Trigger Render deploy — grafista-api-staging"
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: "Trigger Render deploy — grafista-dashboard-staging"
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DASHBOARD }}"

      # RENDER_DEPLOY_HOOK_WORKER is deliberately NOT called here — there
      # is no separate worker service to deploy
      # (docs/render-staging-blueprint.template.yaml's own "Worker: NOT a
      # services: entry" note). The name is reserved/listed in this
      # template's secrets inventory below only because the task that
      # produced this template asked for it by name — it should stay
      # unset and unused unless the architecture itself changes to a
      # real separate worker service, which is not planned.

      - name: "TODO: wait for Render deploy to finish before proceeding"
        run: |
          echo "Render Deploy Hooks trigger a deploy asynchronously — this"
          echo "template does not yet poll Render's API for deploy completion."
          echo "A real implementation should poll the Render API (or use a"
          echo "documented wait/status mechanism) before running migrate/health/smoke"
          echo "below, otherwise they may run against a still-deploying service."
          echo "Not implemented here — decision required at provisioning time."

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── Step 3: Migrate ──────────────────────────────────────────────
      # Matches docs/deployment-runbook.md §20c — same db:migrate script,
      # now pointed at Render Postgres's connection string.
      - name: Run database migrations (staging)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm --filter @grafista/api run db:migrate

      # ── Step 4: Health check ─────────────────────────────────────────
      - name: Verify /api/health and /api/health/ready
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: |
          curl -sf "${STAGING_API_URL}/api/health"
          curl -s "${STAGING_API_URL}/api/health/ready" | tee /tmp/ready.json
          # Per docs/deployment-runbook.md §8: overall "status": "degraded"
          # alone is NOT an automatic failure — only a genuine "error" on
          # database/storage should fail this step. This template does not
          # implement that judgement call in shell; a real implementation
          # should parse /tmp/ready.json's individual checks, not just the
          # top-level status field.

      # ── Step 5: Smoke ────────────────────────────────────────────────
      - name: Run staging smoke checks
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: pnpm --filter @grafista/api run smoke:staging

      # ── Step 6: Managed restore drill — MANUAL GATE, not automated ───
      # Deliberately NOT an automated step in this workflow. A restore
      # drill is inherently destructive to whatever target instance it
      # runs against (docs/backup-restore-runbook.md §5's own "DESTRUCTIVE"
      # warning on the local/staging drill) — auto-running it on every
      # deploy would risk destroying the very staging environment this
      # workflow just verified. docs/backup-restore-runbook.md's new
      # "Render + R2 Managed Staging Restore Drill" section describes the
      # procedure; it is triggered manually and separately, on a cadence
      # decided at provisioning time, NOT on every staging deploy.
      - name: "REMINDER: managed staging restore drill is a separate, manual gate"
        run: |
          echo "This deploy does NOT include a restore drill run."
          echo "See docs/backup-restore-runbook.md's 'Render + R2 Managed Staging"
          echo "Restore Drill' section — must PASS at least once, manually,"
          echo "before any production deploy. Not automated here on purpose"
          echo "(a restore drill is destructive to its target instance)."

# ── Secrets this template references (names only — see
# docs/deployment-runbook.md §18c for the full staging env/secrets
# matrix; no values live in this repo) ──────────────────────────────────
#   RENDER_DEPLOY_HOOK_API — grafista-api-staging's Render deploy hook URL
#   RENDER_DEPLOY_HOOK_DASHBOARD — grafista-dashboard-staging's Render deploy hook URL
#   RENDER_DEPLOY_HOOK_WORKER — NOT USED (see the comment above the deploy
#     steps) — reserved name only, no separate worker service exists
#   STAGING_API_URL — grafista-api-staging's Render-assigned URL
#   STAGING_DATABASE_URL — Render Postgres connection string (or rely on
#     Render's own fromDatabase blueprint binding instead of a GitHub
#     secret, per docs/deployment-runbook.md §20b — a decision for
#     provisioning time, both are documented as valid paths)
#   STAGING_AUTH_SECRET
#   STAGING_S3_BUCKET / STAGING_S3_REGION / STAGING_S3_ENDPOINT
#   STAGING_S3_ACCESS_KEY_ID / STAGING_S3_SECRET_ACCESS_KEY
#   STAGING_OPENAI_API_KEY / STAGING_ANTHROPIC_API_KEY — required
#     (presence-only) for the deployed API process to boot at all
#     (apps/api/src/config/env.ts:11-12, fail-fast even when
#     AI_DEFAULT_PROVIDER=fake) — set directly as Render service env/secrets
#     (see docs/render-staging-blueprint.template.yaml), not consumed by
#     any step in THIS workflow file itself, listed here for inventory
#     completeness against §18c
